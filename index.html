
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d35">
  <title>魔法のディズニークイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars"></div>

  <main class="app">

    <header class="header">
      <div class="crown">👑</div>
      <p class="sub-title">MAGICAL QUIZ WORLD</p>
      <h1>魔法のディズニークイズ</h1>
      <p class="header-text">
        夢と魔法の世界へようこそ！
      </p>
    </header>

    <section class="castle">
      <div class="castle-icon">🏰</div>
      <div class="sparkle">✦</div>
      <div class="sparkle sparkle2">✧</div>
      <div class="sparkle sparkle3">✦</div>
    </section>

    <section id="start-screen" class="quiz-card">
      <div class="magic-icon">✨</div>
      <h2>魔法の冒険が始まる！</h2>
      <p>
        ディズニーの映画やキャラクターに関する<br>
        クイズに挑戦してみよう！
      </p>
      <div class="info">
        <span>📖 全5問</span>
        <span>⭐ 4択クイズ</span>
        <span>👑 ランク判定あり</span>
      </div>
      <button id="start-btn" class="main-btn">
        クイズに挑戦する ✨
      </button>
    </section>

    <section id="quiz-screen" class="quiz-card hidden">

      <div class="quiz-top">
        <span id="question-number">QUESTION 1 / 5</span>
        <span id="score">⭐ 0点</span>
      </div>

      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>

      <div class="question-area">
        <p class="question-label">MAGICAL QUESTION</p>
        <h2 id="question-text"></h2>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback hidden">
        <h3 id="feedback-title"></h3>
        <p id="feedback-explanation"></p>
      </div>

      <button id="next-btn" class="main-btn hidden">
        次へ進む ➜
      </button>

    </section>

    <section id="result-screen" class="quiz-card hidden">
      <div class="result-crown">👑</div>
      <p class="result-label">YOUR MAGIC RESULT</p>
      <h2>クイズ終了！</h2>

      <div class="result-score">
        <span id="final-score">0</span>
        <span class="score-total"> / 5 問正解</span>
      </div>

      <div class="rank-box">
        <p>あなたの魔法ランク</p>
        <h3 id="rank-title"></h3>
        <p id="rank-message"></p>
      </div>

      <div class="result-decoration">✨ ⭐ ✨</div>

      <button id="retry-btn" class="main-btn">
        もう一度挑戦する 🔄
      </button>
    </section>

    <footer>
      <p>✨ DREAMS COME TRUE ✨</p>
      <p class="copyright">
        Magical Disney Quiz
      </p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
